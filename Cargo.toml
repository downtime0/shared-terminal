[package]
name = "shared-terminal"
version = "0.1.0"
edition = "2024"
description = "A small shared local or SSH terminal for people and coding agents"
license = "MIT"

[[bin]]
name = "shared-terminal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.18"

